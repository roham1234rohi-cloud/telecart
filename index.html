<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>TELECART</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>TELECART</h1>
    <div class="credits glass"><b id="credits">2</b> cards left</div>
  </header>

  <section class="stage">
    <div id="card" class="card t0">
      <div class="bg"></div><div class="fx"></div>
      <div class="ava"><img id="ava" alt="" crossorigin="anonymous"><span id="avaFb"></span></div>
      <div class="info">
        <div class="name" id="name">Demo User</div>
        <div class="user" id="user">@demo_user</div>
        <p class="bio" id="bioOut">Your bio shows here.</p>
        <div class="game">
          <span>LVL <b id="lvl">1</b></span>
          <div class="xp"><i id="xp"></i></div>
        </div>
      </div>
      <div class="foot"><span id="uid">ID 0</span><span>TELECART</span></div>
    </div>
  </section>

  <section class="glass panel">
    <div class="chips" id="chips" role="tablist" aria-label="Card style"></div>
    <textarea id="bio" rows="3" maxlength="120" placeholder="Write a short bio (3 lines max)"></textarea>
    <div class="row">
      <button id="save" class="btn main">Save PNG</button>
      <button id="share" class="btn">Share</button>
    </div>
  </section>

  <section class="glass panel">
    <p class="small">Invite friends: each one who joins with your link adds <b>+1 card</b>.</p>
    <div class="row">
      <input id="ref" readonly aria-label="Your referral link">
      <button id="copy" class="btn">Copy</button>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
